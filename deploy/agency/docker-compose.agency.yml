# Private "agency" KB (David's corpus) — containerized on megaflax's SEALED network.
#
# A native/host process CANNOT reach the sealed Archon node or the sealed Ollama (Aegis: table-gateway and
# `ollama` resolve only inside `aegis_internal`, which is internal:true with nothing published). So — like
# every other warden/emissary/signet on megaflax — the agency pair runs as containers ON that network, from
# the `hearthold:invocation` image. Loopback-first is preserved: kb-web is reachable from the HOST only via
# Aegis's established tcp-forward bridge publishing 127.0.0.1:<port>; nothing binds a public interface.
#
# Adjust the marked values to megaflax's actual layout, then Aegis runs it. Secrets come from a gitignored
# .env (HEARTHOLD_PASSPHRASE, AGENCY_WARDEN_DID after the build), never this committed file.

x-agency-env: &agency-env
  HEARTHOLD_NODE_URL: http://table-gateway:4299        # the sealed node, by in-net hostname (Aegis: confirm)
  HEARTHOLD_OLLAMA_URL: http://ollama:11434            # the SEALED aegis-ollama-1, NOT the host's :11434
  HEARTHOLD_ANSWER_MODEL: qwen3:8b                      # the book KB reasons (answerThink:true) — needs the 8b
  HEARTHOLD_REGISTRY: local                             # this node anchors on `local`
  HEARTHOLD_DATA_ROOT: /data                            # KB data (vault.json + index.json) — host bind-mounted
  HEARTHOLD_PASSPHRASE: ${HEARTHOLD_PASSPHRASE:?set HEARTHOLD_PASSPHRASE in .env}

services:
  # The custodian: holds the "agency" KB, drains its mailbox, serves member-gated queries. Sealed net only.
  agency-warden:
    image: hearthold:invocation
    container_name: agency-warden
    networks: [sealed]
    init: true
    restart: unless-stopped
    environment: *agency-env
    volumes:
      - ./data-agency:/data                            # the KB data lives here (portable: it's just files)
    command: ["node", "packages/warden/dist/index.js", "serve"]

  # The world-facing kb-web bridge (HTTP↔DIDComm). Binds 0.0.0.0:4313 INSIDE the sealed net so Aegis's
  # tcp-forward bridge can publish it to the host's 127.0.0.1 — the host itself never binds a public port.
  # It addresses the Warden by did:cid (AGENCY_WARDEN_DID), never by URL, and holds no deciding secret.
  agency-kb-mage:
    image: hearthold:invocation
    container_name: agency-kb-mage
    networks: [sealed]
    init: true
    restart: unless-stopped
    depends_on: [agency-warden]
    environment:
      <<: *agency-env
      HEARTHOLD_CONTROL_HOST: "0.0.0.0"                 # bind the container interface (host loopback via the bridge)
      HEARTHOLD_WARDEN_DID: ${AGENCY_WARDEN_DID:?set AGENCY_WARDEN_DID in .env after build:agency-kb prints it}
    volumes:
      - ./data-agency-mage:/data                        # the Mage's own (minimal) data root — NOT the KB
    command: ["node", "packages/emissary/dist/index.js", "kb-web", "4313"]

networks:
  # megaflax's SEALED, internal:true network — the one the existing family wardens attach to.
  # SECURE BY DEFAULT: no generic fallback. Set HEARTHOLD_DOCKER_NETWORK to Aegis's actual sealed net name.
  sealed:
    external: true
    name: ${HEARTHOLD_DOCKER_NETWORK:?set HEARTHOLD_DOCKER_NETWORK to megaflax's sealed net (internal:true), e.g. aegis_internal}
